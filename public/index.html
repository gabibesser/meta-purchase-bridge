<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meta Purchase Bridge</title>
<style>
body{font-family:system-ui;max-width:900px;margin:40px auto;padding:0 18px;background:#fafafa;color:#222}
.card{background:white;border:1px solid #ddd;border-radius:12px;padding:18px;margin:14px 0}
input,button{padding:10px;margin:4px;border:1px solid #bbb;border-radius:8px} button{cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap}.buyer{display:flex;justify-content:space-between;gap:12px;align-items:center}
pre{white-space:pre-wrap;background:#f4f4f4;padding:10px;border-radius:8px}
</style></head>
<body>
<h1>Meta Purchase Bridge</h1>
<div class="card"><h2>Nova compradora</h2>
<form id="f" class="row">
<input name="name" placeholder="Nome" required>
<input name="email" placeholder="E-mail">
<input name="phone" placeholder="Telefone">
<input name="value" type="number" step="0.01" placeholder="Valor" required>
<input name="currency" value="BRL" size="4">
<button>Salvar</button>
</form></div>
<div id="list"></div>
<div class="card"><b>Última resposta</b><pre id="log">—</pre></div>
<script>
const log=x=>document.querySelector("#log").textContent=typeof x==="string"?x:JSON.stringify(x,null,2);
async function load(){
 const r=await fetch("/api/buyers"); const xs=await r.json();
 document.querySelector("#list").innerHTML=(Array.isArray(xs)?xs:[]).map(x=>`
 <div class="card buyer"><div><b>${x.name}</b><br>${x.phone||""} ${x.email||""}<br>R$ ${Number(x.value).toFixed(2)}</div>
 <button onclick="send('${x.id}')">Enviar Purchase</button></div>`).join("");
}
document.querySelector("#f").onsubmit=async e=>{
 e.preventDefault(); const o=Object.fromEntries(new FormData(e.target));
 const r=await fetch("/api/buyers",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(o)});
 const j=await r.json(); log(j); if(r.ok){e.target.reset();e.target.currency.value="BRL";load();}
};
async function send(id){const r=await fetch(`/api/buyers/${id}/send-purchase`,{method:"POST"});log(await r.json());}
load();
</script></body></html>
